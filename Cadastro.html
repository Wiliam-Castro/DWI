<!DOCTYPE html>
<html lang="por-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
    <td><h2>Formulário de cadastro</h2> </td>
        </tr>
        <tr>
        <td><h3>Seu nome:</h3></td>
        <td><input type="text"> <br></td>
        </tr>
        <tr>
        <td><h3>Possui alguma restrição alimentar?</h3></td>
        <td><input type="text"> <br></td>
        </tr>
        <tr>
        <td><h3>Selecione o Curso:</h3></td>
        <td><select>
            <option value="">---SELECIONE---</option>
            <option value="1">Informática</option>
            <option value="2">Engenharia</option>
            <option value="3">Agronomia</option>
            <option value="4">Biologia</option>
        </select></td>
        </tr>
        <br>
        <tr>
        <td><h3>Selecione a turma:</h3></td>
        <td><select>
            <option value="">---SELECIONE---</option>
            <option value="1">1º ano</option>
            <option value="2">2º ano</option>
            <option value="3">3º ano</option>
        </select></td>
        </tr>
        <br>
        <tr>
        <td><h3>Email:</h3></td>
        <td><input type="text"></td>
        </tr> <br>
        <tr>
        <td><h3>Senha:</h3></td>
        <td><input type="password"></td>
        </tr> <br>
        <tr>
        <td><h3>Confirmar Senha:</h3></td>
        <td><input type="password"> </td>
        </tr> <br>
        <tr>
        <td><h3>Perfil:</h3></td>
        <td><input type="checkbox" name="perfil" value="professor"> Professor </td>
        <td><input type="checkbox" name="perfil" value="aluno"> Aluno </td>
        <td><button type="submit">Enviar</button></td>
        </tr>
    </table>
</body>
</html>
